name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build -c Release --no-restore --verbosity normal

      - name: Run all unit tests with coverage
        run: |
          dotnet test BankSharp.Tests/BankSharp.Tests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/*
          retention-days: 7

  publish-nuget:
    name: Publish to NuGet & GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Pack all library projects
        run: |
          mkdir -p ./artifacts
          for proj in \
            BankSharp/BankSharp.csproj \
            BankSharp.DependencyInjection/BankSharp.DependencyInjection.csproj \
            BankSharp.FluentValidation/BankSharp.FluentValidation.csproj \
            BankSharp.EntityFrameworkCore/BankSharp.EntityFrameworkCore.csproj \
            BankSharp.OpenApi/BankSharp.OpenApi.csproj
          do
            dotnet pack "$proj" \
              -c Release \
              -p:PackageVersion=${{ steps.version.outputs.version }} \
              -o ./artifacts
          done

      - name: Verify artifacts
        run: |
          echo "Generated packages:"
          ls -la ./artifacts/*.nupkg
          echo "Generated symbol packages:"
          ls -la ./artifacts/*.snupkg

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --timeout 300

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BankSharp ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## BankSharp ${{ steps.version.outputs.version }}

            ### Included Packages:
            - **BankSharp**
            - **BankSharp.DependencyInjection**
            - **BankSharp.FluentValidation**
            - **BankSharp.EntityFrameworkCore**
            - **BankSharp.OpenApi**
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
