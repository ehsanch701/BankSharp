name: Publish to NuGet

on:
  push:
    # Trigger deployment when a tag like v1.0.0 is pushed
    tags:
      - 'v*.*.*'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  publish:
    name: Build, Test, Pack, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore BankSharp.slnx

      - name: Run Tests (Release Configuration)
        # Verify build and tests in Release mode to ensure stability before publishing
        run: dotnet test BankSharp.slnx --configuration Release --no-restore --verbosity normal

      - name: Pack NuGet Packages
        # Generate nupkg files for all projects
        run: dotnet pack BankSharp.slnx --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet.org
        # Publish packages to NuGet.org using the API key stored in GitHub Secrets
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
